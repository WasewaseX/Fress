name: CI

# General validation layer for pull requests (and pushes to main).
# Packaging stays exclusive to tag pushes (release.yml): PRs get typecheck,
# unit tests, the catalog validator, a production frontend build, Rust
# formatting/linting, and the Rust test suite on every desktop platform
# Fress ships for — everything needed to know a change is sound without
# paying for six platform bundles.
#
# Integration gates (quality/final-integration-qa):
#   - e2e: the full Playwright suite (workflows A-J + visual regression)
#     against the production build on Linux, with deterministic fixture
#     network only - never live GitHub/F-Droid/vendor calls.
#   - perf: the integrated catalog benchmark; deterministic count-based
#     invariants (render isolation, persistence coalescing) are BLOCKING,
#     wall-clock numbers are recorded as informational artifacts.
#
# Hardening notes:
#   - Least privilege: the workflow only ever reads repository contents.
#   - Third-party and first-party actions are pinned to commit SHAs, so a
#     compromised tag upstream cannot move what runs here.
#   - persist-credentials: false keeps the checkout token out of .git/config,
#     so untrusted PR code (npm scripts run below) cannot reach it.
#   - The E2E/perf suites run against untrusted PR code too: they hold no
#     secrets and their network layer is fixture-backed and deny-all by
#     default (tests/e2e/netpolicy.ts aborts every non-loopback request).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    # The release workflow refuses a tag whose version disagrees with
    # package.json, Cargo.toml or tauri.conf.json. Catch the drift here,
    # at PR time, instead of at release time. The lockfiles are checked
    # too: package-lock.json records the package version twice (root and
    # ""), and a release cut from a drifted lockfile ships a mismatched
    # npm view. Cargo.lock records the crate version where the crate is
    # named ("fress") - a release built from a stale lockfile would embed
    # the old version in the binary metadata.
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: package.json, Cargo.toml, tauri.conf.json and lockfiles must agree
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          LOCK_ROOT=$(node -p "require('./package-lock.json').version")
          LOCK_PKG=$(node -p "require('./package-lock.json').packages[''].version")
          CARGO_LOCK_VERSION=$(awk -F'"' '/^name = "fress"$/{getline; sub(/^version = "/,""); sub(/"$/,""); print; exit}' src-tauri/Cargo.lock)
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$CARGO_LOCK_VERSION" ] || fail "could not read the 'fress' crate version from src-tauri/Cargo.lock"
          [ "$CARGO_VERSION" = "$VERSION" ] || fail "Cargo.toml version ($CARGO_VERSION) != package.json version ($VERSION)"
          [ "$TAURI_VERSION" = "$VERSION" ] || fail "tauri.conf.json version ($TAURI_VERSION) != package.json version ($VERSION)"
          [ "$LOCK_ROOT" = "$VERSION" ] || fail "package-lock.json .version ($LOCK_ROOT) != package.json version ($VERSION)"
          [ "$LOCK_PKG" = "$VERSION" ] || fail "package-lock.json packages[''].version ($LOCK_PKG) != package.json version ($VERSION)"
          [ "$CARGO_LOCK_VERSION" = "$VERSION" ] || fail "src-tauri/Cargo.lock fress version ($CARGO_LOCK_VERSION) != package.json version ($VERSION)"
          echo "version consistency: package.json=$VERSION Cargo.toml=$CARGO_VERSION tauri.conf.json=$TAURI_VERSION package-lock.json=$LOCK_ROOT Cargo.lock(fress)=$CARGO_LOCK_VERSION"

  frontend:
    name: Typecheck, tests, catalog, security, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies from the lockfile
        # npm ci refuses to run unless package.json and package-lock.json
        # agree, which is the reproducibility guarantee for this job.
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Catalog validator
        # The catalog is the product: duplicate ids, dead links, commands
        # that belong to no platform the app supports, missing icons or
        # translations all fail the PR.
        run: npm run validate:catalog
      - name: Security config validator
        # The CSP and Tauri allowlist claims must match the source: a
        # connect-src origin that never worked, a plugin the code cannot
        # reach, or a widened remote domain all fail here (and the validator
        # is what keeps the security docs honest).
        run: npm run validate:security
      - name: Production build
        run: npm run build

  rust:
    name: Rust fmt, clippy, tests (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Build the frontend
        # tauri::generate_context! embeds the frontendDist directory at
        # compile time - without a built ../dist the proc macro panics and
        # the Rust jobs fail for reasons that have nothing to do with Rust.
        run: |
          npm ci
          npm run build
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        # --all-targets lints the lib, its integration tests and any example
        # binaries, so lint-clean code is enforced for test code too.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        # The gate that used to be missing: the suite must RUN, not merely
        # compile (a green cargo check proved nothing about the tests).
        # cargo test compiles every target clippy does not already cover,
        # so no separate `cargo check` step is needed.
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-native:
    # Core native tests on the other desktop platforms Fress ships for.
    # A full bundle build per platform stays exclusive to tag pushes
    # (release.yml); here the Rust code must at least compile and its test
    # suite must pass on the same OSes the installers are produced on.
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Build the frontend
        run: |
          npm ci
          npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    # Integration gate: the complete browser suite (workflows A-J plus the
    # visual regression set) runs against the PRODUCTION build served by
    # vite preview. Deterministic fixtures only - the network layer answers
    # every resolver/vendor/self-update endpoint from fixtures and aborts all
    # other external requests, so shared GitHub quota can never flake a PR.
    # Visual baselines were generated on Linux (Chromium headless); macOS and
    # Windows rasterize text differently and are NOT part of this gate (see
    # docs/quality-gates.md, "What still requires manual device testing").
    name: E2E + visual (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Production build (the suite runs against the shipped artifact)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the E2E + visual suite
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  perf:
    # Performance gate: the integrated catalog benchmark runs the real
    # production build in headless Chromium with a 500-entry fixture and a
    # scripted download stream. The DETERMINISTIC invariants fail the job:
    #   - zero unrelated card mutations during a 1000-event progress burst
    #     (the React render-isolation contract),
    #   - persistence writes stay inside the coalescing bound.
    # Wall-clock numbers (usable-catalog time, search latency, view-switch
    # time) are machine-sensitive: they are recorded to the job artifact and
    # compared against scripts/perf/baselines/catalog.json INFORMATIONALLY -
    # a 10% machine delta must never fail a PR, a rendering-contract
    # regression must always.
    name: Perf invariants (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Production build (the benchmark runs against the shipped artifact)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the integrated catalog benchmark
        run: npm run test:perf
      - name: Attach the measurement record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-results
          path: scripts/perf/results/
          retention-days: 30
          if-no-files-found: ignore
