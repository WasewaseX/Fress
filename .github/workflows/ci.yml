name: CI

# General validation layer for pull requests (and pushes to main).
# Packaging stays exclusive to tag pushes (release.yml): PRs get typecheck,
# unit tests, the catalog validator, a production frontend build, Rust
# formatting/linting, and the Rust test suite on every desktop platform
# Fress ships for — everything needed to know a change is sound without
# paying for six platform bundles.
#
# Integration gates (quality/final-integration-qa):
#   - e2e: the full Playwright suite (workflows A-J + visual regression)
#     against the production build on Linux, with deterministic fixture
#     network only - never live GitHub/F-Droid/vendor calls.
#   - perf: the integrated catalog benchmark; deterministic count-based
#     invariants (render isolation, persistence coalescing) are BLOCKING,
#     wall-clock numbers are recorded as informational artifacts.
#
# Hardening notes:
#   - Least privilege: the workflow only ever reads repository contents.
#   - Third-party and first-party actions are pinned to commit SHAs, so a
#     compromised tag upstream cannot move what runs here.
#   - persist-credentials: false keeps the checkout token out of .git/config,
#     so untrusted PR code (npm scripts run below) cannot reach it.
#   - The E2E/perf suites run against untrusted PR code too: they hold no
#     secrets and their network layer is fixture-backed and deny-all by
#     default (tests/e2e/netpolicy.ts aborts every non-loopback request).
#
# Runner + action maintenance (docs/quality-gates.md, section 2.4):
#   - Actions are kept on maintained releases that run on Node 24 natively
#     (checkout v7, setup-node v7, upload-artifact v7): the previous v4 pins
#     triggered a real "Node.js 20 is deprecated" warning on every job
#     because the runner force-upgraded them. Pins stay full commit SHAs -
#     never loosened to silence a warning.
#   - Rendering-sensitive jobs are PINNED, not floating: e2e + perf compare
#     pixels/font rasterization, and ubuntu-latest migrates to Ubuntu 26
#     (2026-10-19, runner-images#14748). They run ubuntu-24.04 - the image
#     the visual baselines are green on - so no platform change can arrive
#     as a surprise red. Moving to a newer image is a deliberate PR that
#     regenerates the baselines on that image and proves the suite green.
#   - `rust` moves deliberately from ubuntu-22.04 to ubuntu-24.04: 22.04 is
#     an aging image, and the release path (release.yml, not this file)
#     builds the Linux bundle on ubuntu-latest = 24.04, so CI now tests on
#     the same Linux the installers are produced on. This PR's own CI run
#     is the test of that migration.
#   - Distro-insensitive jobs (version-guard, frontend, artifact-audit-tests)
#     stay on ubuntu-latest: their toolchains are pinned by setup-node and
#     the lockfiles, and nothing they measure depends on the distro.
#   - The floating migration itself is TESTED, not just accepted: the
#     ubuntu26-canary job runs the cheapest owned toolchain on the explicit
#     ubuntu-26.04 image before the alias flip (2026-10-19, runner-images
#     #14748), so the floaters' first day on the new distro is not a
#     surprise red. A red canary means: pin the floaters to ubuntu-24.04
#     first, then fix the gap.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    # Version coherence is validated by ONE authoritative implementation:
    # scripts/ci/validate-versions.ts, run as `npm run validate:versions`
    # (Agent 2's implementation, wired here by the CI owner). The rules do
    # not live in this workflow - the steps below are only the invocation.
    # It catches drift between package.json, Cargo.toml, tauri.conf.json and
    # both lockfiles at PR time, instead of at release time. Tag binding is
    # enforced by the same command in release.yml (--release-tag); a normal
    # development build deliberately does NOT have to match the currently
    # published release version.
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 native; v4 warned "Node.js 20 is deprecated")
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24 native; installs the SAME pinned Node 20 toolchain via node-version)
        with:
          node-version: 20
      - name: Install dependencies from the lockfile
        # tsx (the validator's TypeScript loader) comes from devDependencies;
        # the validator itself only touches node:fs/node:path/node:url.
        run: npm ci
      - name: All manifests and lockfiles must agree (scripts/ci/validate-versions.ts)
        run: npm run validate:versions

  ubuntu26-canary:
    # Deliberate image-migration test (docs/quality-gates.md, section 2.4):
    # the distro-insensitive jobs float on ubuntu-latest, which migrates to
    # Ubuntu 26 beginning 2026-10-19. This job runs that same cheap,
    # deterministic toolchain on the EXPLICIT ubuntu-26.04 image, so the
    # alias flip is proven before it happens. Green = the floaters'
    # toolchain (checkout, setup-node, npm ci, the version validator) works
    # on the new distro. Red = pin the floaters to ubuntu-24.04 FIRST.
    name: Ubuntu 26 canary (version toolchain)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 native)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24 native; installs the SAME pinned Node 20 toolchain via node-version)
        with:
          node-version: 20
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: All manifests and lockfiles must agree (scripts/ci/validate-versions.ts)
        run: npm run validate:versions

  no-chinese:
    # Zero-Chinese-content gate: the project advertises exactly five UI
    # languages (en, fa RTL, es, fr, de - src/lib/i18n.tsx). This job makes
    # "zero Han/CJK Chinese content" an OBSERVED result on every PR: tracked
    # + untracked files, filenames, PNG/JPEG text metadata and opaque-binary
    # printable-run payloads are scanned by a dependency-free checker
    # (scripts/ci/check-no-chinese.mjs) that fails closed on any hit, any
    # unreadable file and on its own crash. Font binaries are deliberately
    # skipped: glyph coverage inside a font is not Chinese-language UI copy.
    # Kana/Hangul (non-Chinese CJK) are reported as exit-neutral warnings
    # routed to the relevant owner.
    name: No Chinese content (zero-hit scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 native)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24 native; the checker itself is dependency-free, setup-node only pins the toolchain)
        with:
          node-version: 20
      - name: Zero-hit Chinese-content scan (scripts/ci/check-no-chinese.mjs)
        run: node scripts/ci/check-no-chinese.mjs

  frontend:
    name: Typecheck, tests, catalog, security, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 native; v4 warned "Node.js 20 is deprecated")
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24 native; installs the SAME pinned Node 20 toolchain via node-version)
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies from the lockfile
        # npm ci refuses to run unless package.json and package-lock.json
        # agree, which is the reproducibility guarantee for this job.
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Version coherence (validate:versions)
        # Same authoritative command as the version-guard job; running it
        # inside the build job too costs one second and keeps the build
        # path honest even if the standalone job is ever restructured.
        run: npm run validate:versions
      - name: Unit tests
        run: npm test
      - name: Catalog validator
        # The catalog is the product: duplicate ids, dead links, commands
        # that belong to no platform the app supports, missing icons or
        # translations all fail the PR.
        run: npm run validate:catalog
      - name: Security config validator
        # The CSP and Tauri allowlist claims must match the source: a
        # connect-src origin that never worked, a plugin the code cannot
        # reach, or a widened remote domain all fail here (and the validator
        # is what keeps the security docs honest).
        run: npm run validate:security
      - name: Production build
        run: npm run build

  rust:
    name: Rust fmt, clippy, tests (linux)
    # Deliberate 22.04 -> 24.04 migration (see the header note): parity with
    # the Linux image the release bundles are built on, before the 22.04
    # image ages out from under us. Proven by this repo's own CI on the
    # branch that introduced it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 native; v4 warned "Node.js 20 is deprecated")
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24 native; installs the SAME pinned Node 20 toolchain via node-version)
        with:
          node-version: 20
          cache: npm
      - name: Build the frontend
        # tauri::generate_context! embeds the frontendDist directory at
        # compile time - without a built ../dist the proc macro panics and
        # the Rust jobs fail for reasons that have nothing to do with Rust.
        run: |
          npm ci
          npm run build
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        # --all-targets lints the lib, its integration tests and any example
        # binaries, so lint-clean code is enforced for test code too.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        # The gate that used to be missing: the suite must RUN, not merely
        # compile (a green cargo check proved nothing about the tests).
        # cargo test compiles every target clippy does not already cover,
        # so no separate `cargo check` step is needed.
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-native:
    # Core native tests on the other desktop platforms Fress ships for.
    # A full bundle build per platform stays exclusive to tag pushes
    # (release.yml); here the Rust code must at least compile and its test
    # suite must pass on the same OSes the installers are produced on.
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 native; v4 warned "Node.js 20 is deprecated")
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24 native; installs the SAME pinned Node 20 toolchain via node-version)
        with:
          node-version: 20
          cache: npm
      - name: Build the frontend
        run: |
          npm ci
          npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  artifact-audit-tests:
    # The release-artifact verifier (scripts/ci/verify-release-artifacts.py)
    # is the gate that keeps a corrupted or mis-manifested release private.
    # Its rejection behavior is executable: this job proves the verifier
    # actually REJECTS tampered checksums, bad signatures, wrong-version
    # manifests, stray sidecars and malformed manifests - using synthetic
    # temp-dir fixtures, never a real release. A verifier that cannot prove
    # its own rejection paths is not a gate, it is a hope.
    name: Release-artifact verifier tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 native; v4 warned "Node.js 20 is deprecated")
        with:
          persist-credentials: false
      - name: Run the verifier test suite (stdlib unittest)
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  e2e:
    # Integration gate: the complete browser suite (workflows A-J plus the
    # visual regression set) runs against the PRODUCTION build served by
    # vite preview. Deterministic fixtures only - the network layer answers
    # every resolver/vendor/self-update endpoint from fixtures and aborts all
    # other external requests, so shared GitHub quota can never flake a PR.
    # Visual baselines were generated on Linux (Chromium headless); macOS and
    # Windows rasterize text differently and are NOT part of this gate (see
    # docs/quality-gates.md, "What still requires manual device testing").
    name: E2E + visual (linux)
    # Pinned (NOT ubuntu-latest): visual baselines are pixel comparisons and
    # ubuntu-latest migrates to Ubuntu 26 on 2026-10-19 (runner-images#14748).
    # 24.04 is the image the baselines are green on; a move to 26 must be a
    # deliberate PR that regenerates them on that image (docs 2.4).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 native; v4 warned "Node.js 20 is deprecated")
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24 native; installs the SAME pinned Node 20 toolchain via node-version)
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Production build (the suite runs against the shipped artifact)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the E2E + visual suite
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24 native since v6)
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  perf:
    # Performance gate: the integrated catalog benchmark runs the real
    # production build in headless Chromium with a 500-entry fixture and a
    # scripted download stream. The DETERMINISTIC invariants fail the job:
    #   - zero unrelated card mutations during a 1000-event progress burst
    #     (the React render-isolation contract),
    #   - persistence writes stay inside the coalescing bound.
    # Wall-clock numbers (usable-catalog time, search latency, view-switch
    # time) are machine-sensitive: they are recorded to the job artifact and
    # compared against scripts/perf/baselines/catalog.json INFORMATIONALLY -
    # a 10% machine delta must never fail a PR, a rendering-contract
    # regression must always.
    name: Perf invariants (linux)
    # Same pin rationale as e2e: headless-Chromium rendering must not drift
    # with the ubuntu-latest image migration (docs 2.4).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24 native; v4 warned "Node.js 20 is deprecated")
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24 native; installs the SAME pinned Node 20 toolchain via node-version)
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Production build (the benchmark runs against the shipped artifact)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the integrated catalog benchmark
        run: npm run test:perf
      - name: Attach the measurement record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24 native since v6)
        with:
          name: perf-results
          path: scripts/perf/results/
          retention-days: 30
          if-no-files-found: ignore
