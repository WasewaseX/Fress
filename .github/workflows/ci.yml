name: CI

# General validation layer for pull requests (and pushes to main).
# Packaging stays exclusive to tag pushes (release.yml): PRs get typecheck,
# unit tests, the catalog validator, a production frontend build and a Rust
# compile check — everything needed to know a change is sound without
# paying for six platform bundles.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, tests, catalog, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Catalog validator
        # The catalog is the product: duplicate ids, dead links, commands
        # that belong to no platform the app supports, missing icons or
        # translations all fail the PR.
        run: npm run validate:catalog
      - name: Production build
        run: npm run build

  rust:
    name: Rust check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build the frontend
        # tauri::generate_context! embeds the frontendDist directory at
        # compile time - without a built ../dist the proc macro panics and
        # cargo check fails for reasons that have nothing to do with Rust.
        run: |
          npm ci
          npm run build
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
