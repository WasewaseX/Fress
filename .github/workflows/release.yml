name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default; every job that writes release assets requests
# contents: write for itself below.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes to git; the release uploads
          # authenticate via GH_TOKEN env vars instead.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install dependencies from the lockfile
        # tsx (the validator's TypeScript loader) comes from devDependencies.
        run: npm ci
      - name: Refuse a tag that exists in a conflicting state
        # The unique v1.0.0 stable tag (and every future tag) must point at
        # EXACTLY the commit this workflow is building. A tag that was
        # re-pointed after the run started, or that resolves to some other
        # commit than the checked-out release candidate, is a conflicting
        # state: building it would put bytes on a release whose tag proves
        # nothing about the source. Fail closed instead; never move or
        # re-point an existing tag.
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          TAGGED=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAGGED" != "$HEAD_SHA" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${TAGGED} but this workflow is building ${HEAD_SHA}. The tag is in a conflicting state; never move or re-point an existing tag - delete the run, restore the tag to the intended release commit and re-tag only from the validated candidate."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} resolves to the exact release commit ${HEAD_SHA}"
      - name: No-Chinese source gate (single source checker)
        # Agent 2's one no-Chinese checker runs against the release candidate
        # BEFORE anything is built or uploaded. The release fails closed on
        # any unintended Chinese/CJK hit in the candidate source of the
        # release commit (the pre-build scan), and equally on a missing
        # checker: a release that could not be scanned must never publish
        # silently.
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/check-no-chinese.mjs ]; then
            echo "::error::scripts/ci/check-no-chinese.mjs is missing - the no-Chinese gate cannot run. The release fails closed until the single source checker (owned by the CI agent) is present on the release commit."
            exit 1
          fi
          node scripts/ci/check-no-chinese.mjs
      - id: v
        run: |
          set -euo pipefail

          # One version everywhere, validated by ONE authoritative
          # implementation: scripts/ci/validate-versions.ts (Agent 2's
          # validator, the same command CI runs as `npm run
          # validate:versions`). This step does not re-implement the rules
          # in shell; it only derives the job outputs the later build jobs
          # consume. On a tag push the validator additionally proves the
          # tag equals v<version>, so a release whose installer would
          # report a different version than its tag stops here. On
          # workflow_dispatch (no tag) the same coherence rules run without
          # tag binding.
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            npm run validate:versions -- --release-tag "${GITHUB_REF_NAME}"
          else
            npm run validate:versions
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # Prerelease classification via THE authoritative grammar
          # (validate-versions.ts --is-prerelease), not a second suffix list:
          # plain 1.0.0 classifies as a STABLE GitHub release, any version
          # carrying a SemVer prerelease segment (beta, rc, next, ...) stays a
          # prerelease, and an unparsable version fails the run instead of
          # being published as stable.
          PRERELEASE=$(npx tsx scripts/ci/validate-versions.ts --is-prerelease "$VERSION")
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          # Channel-conditional release-notes line: a stable release must not
          # carry prerelease wording and a prerelease must not pose as stable.
          if [ "$PRERELEASE" = "true" ]; then
            {
              echo "channel_note<<FRESS_NOTE_EOF"
              echo "Pre-release: features may change between releases."
              echo "FRESS_NOTE_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel_note<<FRESS_NOTE_EOF"
              echo "**Stable release.** The in-app updater's stable channel only offers stable releases; beta and alpha builds stay on their own channels."
              echo ""
              echo "**Coming from a beta build?** Your beta installation is never downgraded automatically. To move to stable deliberately: on Windows run the v$VERSION setup.exe over the existing install (the MSI requires uninstalling the beta first); on macOS replace the app in /Applications; on Linux install the v$VERSION bundle (deb/rpm need an explicit downgrade: \`apt install --allow-downgrades\` or \`rpm -U --oldpackage\`); on Android uninstall the beta APK first, which clears the app's private data. Desktop settings live in your user profile, not the install directory, and survive the transition."
              echo "FRESS_NOTE_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

  create-release:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    needs: version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes to git; the release uploads
          # authenticate via GH_TOKEN env vars instead.
          persist-credentials: false
      - name: Create the release
        id: create
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Fress v${{ needs.version.outputs.version }}
          body: |
            Fress v${{ needs.version.outputs.version }}. A short directory of free and open-source apps.

            **Installers for every platform**
            | Platform | File |
            | --- | --- |
            | Windows (installer) | `Fress_*_x64-setup.exe` |
            | Windows (MSI) | `Fress_*_x64_en-US.msi` |
            | Windows (portable, no install) | `Fress_*_x64-portable.zip` |
            | Windows ARM64 (installer) | `Fress_*_arm64-setup.exe` |
            | Windows ARM64 (portable) | `Fress_*_arm64-portable.zip` |
            | macOS (Apple Silicon) | `Fress_*_aarch64.dmg` |
            | macOS (Intel) | `Fress_*_x64.dmg` |
            | Linux (AppImage) | `Fress_*_amd64.AppImage` |
            | Linux (deb) | `Fress_*_amd64.deb` |
            | Linux (rpm) | `Fress-*.x86_64.rpm` |
            | Android (universal APK, every device) | `Fress_*_universal.apk` |
            | Android (arm64 APK, smaller download) | `Fress_*_arm64.apk` |
            | Android (armv7 APK) | `Fress_*_arm.apk` |
            | Android (x86_64 / x86 APK) | `Fress_*_x64.apk` / `Fress_*_x86.apk` |

            **Where Fress is distributed**
            Only here, on the official GitHub Releases page of this repository, always with `SHA256SUMS.txt` next to the files. If you found a Fress installer on any other site or file host, it is not ours.

            **Windows: antivirus warnings and "Unknown Publisher"**
            The installer, the MSI and the portable exe carry the project's persistent publisher signature when CI has the certificate configured; until that signature chains to a trusted root, Microsoft Defender's machine-learning heuristics can still flag clean downloads (for example `Trojan:Win32/Bearfoos.A!ml`). Verify the SHA256 against `SHA256SUMS.txt` — if it matches, the file is exactly what this repository built. Reporting false positives, certificate setup and long-term signing plans: `CODE_SIGNING.md` in the repository. The blue "Unknown publisher" warning appears until a trusted certificate is in place: **More info**, then **Run anyway**.

            **macOS: first launch**
            The dmg is signed and notarized when the Apple credentials are configured in CI (see `CODE_SIGNING.md`). Without them, macOS may refuse to open the app the first time: right-click the app icon and choose **Open**, then confirm. That only happens once.

            Verify any download against `SHA256SUMS.txt`.

            ${{ needs.version.outputs.channel_note }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # Draft until the verify-release job proves every required artifact
          # is present and hashes match. A failed build then leaves nothing
          # public: no half-populated release page users can stumble into.
          draft: true

      - name: Bind the draft to its tag if GitHub left it untagged
        # GitHub has a race where a draft created for an existing tag stays
        # "untagged-<hash>" and is invisible to tag-based lookups: the gh CLI
        # resolves drafts by their tag_name field (fixable), the raw by-tag
        # API endpoint never resolves them at all. Seen once in production
        # (v1.0.6-beta): the Windows jobs failed with "release not found".
        # Re-binding the field right after creation keeps every later
        # tag-based step working.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID="${{ steps.create.outputs.id }}"
          TAG="${{ needs.version.outputs.tag }}"
          CUR="$(gh api "repos/${{ github.repository }}/releases/$ID" --jq '.tag_name')"
          if [ "$CUR" != "$TAG" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/$ID" -f tag_name="$TAG" --jq '.tag_name'
            echo "re-bound draft tag: $CUR -> $TAG"
          else
            echo "draft correctly bound to $TAG"
          fi

  build-windows:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    needs: [version, create-release]
    runs-on: windows-latest
    env:
      # true only when ALL SIX Trusted Signing secrets are set. The signing
      # action reads every one of them; a gate that tested only a subset
      # would activate the path and then fail inside azure/trusted-signing
      # with an opaque empty-input error. Secrets can't be read in a
      # step-level if, so this goes through env.
      FRESS_SIGNING_CONFIGURED: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_CODESIGNING_ENDPOINT != '' && secrets.AZURE_CODESIGNING_ACCOUNT != '' && secrets.AZURE_CODESIGNING_PROFILE != '' }}
      # true when the persistent publisher certificate is fully configured:
      # importing the .pfx needs BOTH the key material and its password, so
      # both must be present before this path activates.
      FRESS_PFX_CONFIGURED: ${{ secrets.WINDOWS_PFX_B64 != '' && secrets.WINDOWS_PFX_PASSWORD != '' }}
      # true when the Tauri updater signing key is set (updater artifacts).
      FRESS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

      # Individual presence flags for the diagnostic step below, which
      # explains exactly which secrets are missing when a signing path
      # silently did NOT activate.
      FRESS_AZ_1: ${{ secrets.AZURE_TENANT_ID != '' }}
      FRESS_AZ_2: ${{ secrets.AZURE_CLIENT_ID != '' }}
      FRESS_AZ_3: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
      FRESS_AZ_4: ${{ secrets.AZURE_CODESIGNING_ENDPOINT != '' }}
      FRESS_AZ_5: ${{ secrets.AZURE_CODESIGNING_ACCOUNT != '' }}
      FRESS_AZ_6: ${{ secrets.AZURE_CODESIGNING_PROFILE != '' }}
      FRESS_PFX_1: ${{ secrets.WINDOWS_PFX_B64 != '' }}
      FRESS_PFX_2: ${{ secrets.WINDOWS_PFX_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes to git; the release uploads
          # authenticate via GH_TOKEN env vars instead.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Diagnose partial signing configuration
        # A gate that requires ALL secrets of a path must say WHICH are
        # missing, or a half-configured repo silently falls back to the
        # unsigned path with no hint why. This step only speaks up when at
        # least one secret of a path is set but the path is not complete.
        if: env.FRESS_SIGNING_CONFIGURED != 'true'
        shell: pwsh
        run: |
          $azure = @('FRESS_AZ_1','FRESS_AZ_2','FRESS_AZ_3','FRESS_AZ_4','FRESS_AZ_5','FRESS_AZ_6')
          $azureNames = @('AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_CODESIGNING_ENDPOINT','AZURE_CODESIGNING_ACCOUNT','AZURE_CODESIGNING_PROFILE')
          $missing = @()
          for ($i = 0; $i -lt 6; $i++) {
            if ([Environment]::GetEnvironmentVariable($azure[$i]) -ne 'true') { $missing += $azureNames[$i] }
          }
          if ($missing.Count -gt 0 -and $missing.Count -lt 6) {
            Add-Content $env:GITHUB_STEP_SUMMARY "WARNING: Azure Trusted Signing is partially configured and will NOT run. Missing secrets: $($missing -join ', '). All six are required (see CODE_SIGNING.md)."
          }
          $pfxMissing = @()
          if ($env:FRESS_PFX_1 -ne 'true') { $pfxMissing += 'WINDOWS_PFX_B64' }
          if ($env:FRESS_PFX_2 -ne 'true') { $pfxMissing += 'WINDOWS_PFX_PASSWORD' }
          if ($pfxMissing.Count -eq 1) {
            Add-Content $env:GITHUB_STEP_SUMMARY "WARNING: the persistent-certificate path is half-configured and will NOT run. Missing secret: $($pfxMissing -join ', '). Both WINDOWS_PFX_B64 and WINDOWS_PFX_PASSWORD are required."
          }
      - name: Build Windows installer (NSIS)
        # Deliberately WITHOUT the Tauri updater key: updater signatures
        # generated at build time describe the UNSIGNED exe, but Authenticode
        # signing below rewrites the exe bytes afterwards and would silently
        # invalidate them. The .sig files are regenerated over the FINAL
        # binaries at the end of this job and latest.json is assembled by the
        # updater-manifest job from those final signatures.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          # NSIS only here. WiX (MSI) rejects prerelease versions like
          # 1.0.1-alpha ("Product version must be major.minor.build"), and
          # with both targets in one invocation that failure killed the whole
          # step before the finished NSIS exe could be uploaded - which is
          # exactly how v1.0.1-alpha lost its x64 installer. The MSI is built
          # separately below with a numeric build version.
          args: '--target x86_64-pc-windows-msvc --bundles nsis'
      - name: Build Windows MSI with a numeric build version
        # WiX only accepts ProductVersion of the form major.minor.build, so
        # the MSI is built from a config override that strips the prerelease
        # suffix (1.0.2-alpha -> 1.0.2). The file is then renamed to carry the
        # full version so the release page stays uniform. Trade-off: two
        # prereleases of the same numeric version (1.0.2-alpha, 1.0.2-beta)
        # share an MSI ProductVersion; Windows may then offer "repair"
        # instead of a clean in-place upgrade. The NSIS installer, the
        # portable zip and the in-app updater all use the real version.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.version.outputs.version }}"
          $numeric = ($version -replace '-.*$', '')
          $overrides = "{`"version`": `"$numeric`", `"bundle`": { `"targets`": [`"msi`"] } }"
          Set-Content -Path msi-overrides.json -Value $overrides -Encoding utf8NoBOM
          Write-Host "Building MSI with ProductVersion $numeric (app version $version)"
          npx tauri build --target x86_64-pc-windows-msvc --bundles msi --config msi-overrides.json
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed with exit code $LASTEXITCODE" }
          $msi = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found in bundle folder" }
          $finalName = "Fress_${version}_x64_en-US.msi"
          Copy-Item $msi.FullName $finalName -Force
          # No upload here: the MSI joins the installer and the portable exe
          # in getting a publisher signature first, then a dedicated step
          # uploads it. (It used to be uploaded straight away and stayed the
          # only unsigned Windows artifact.)
          Write-Host "MSI staged in workspace root as $finalName (uploaded after signing)"
      - name: Sign with Azure Trusted Signing
        # Runs only when the signing account is configured. One-time setup
        # steps are in CODE_SIGNING.md.
        if: env.FRESS_SIGNING_CONFIGURED == 'true'
        uses: azure/trusted-signing-action@b37b55d83a0c5c993cb33d1b376b20b75e13668c # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODESIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign the MSI with Azure Trusted Signing
        # The MSI is the third Windows artifact and used to be the only one
        # that skipped signing entirely. It is staged at the workspace root
        # by the build step above.
        if: env.FRESS_SIGNING_CONFIGURED == 'true'
        uses: azure/trusted-signing-action@b37b55d83a0c5c993cb33d1b376b20b75e13668c # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODESIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign the portable exe with Azure Trusted Signing
        if: env.FRESS_SIGNING_CONFIGURED == 'true'
        uses: azure/trusted-signing-action@b37b55d83a0c5c993cb33d1b376b20b75e13668c # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODESIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\x86_64-pc-windows-msvc\release
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Upload the signed installer
        if: env.FRESS_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $bundle.FullName
          Write-Host "Signature status: $($sig.Status), signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Trusted Signing did not produce a valid signature: $($sig.Status)" }
          gh release upload "${{ needs.version.outputs.tag }}" $bundle.FullName --clobber --repo "${{ github.repository }}"
          Write-Host "Signed installer uploaded: $($bundle.Name)"

      - name: Sign with the persistent publisher certificate
        # One .pfx is kept as a repository secret (WINDOWS_PFX_B64 = base64 of
        # the certificate + private key, WINDOWS_PFX_PASSWORD) and reused for
        # every release, so all builds carry the same publisher identity and
        # can accumulate real Defender/SmartScreen reputation over time. The
        # old per-run self-signed certificates were removed: a fresh identity
        # every release builds no reputation with anyone. Setup: CODE_SIGNING.md.
        if: env.FRESS_SIGNING_CONFIGURED != 'true' && env.FRESS_PFX_CONFIGURED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_PFX_B64: ${{ secrets.WINDOWS_PFX_B64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [Convert]::FromBase64String($env:WINDOWS_PFX_B64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "fress-sign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $pwd2 = ConvertTo-SecureString -String $env:WINDOWS_PFX_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $pwd2
          Write-Host "Imported publisher certificate: $($cert.Thumbprint) ($($cert.Subject))"

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.DirectoryName -match 'x64$' } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }

          $bundle = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /td SHA256 `
            /tr http://timestamp.digicert.com $bundle.FullName

          # Hard check: the installer must carry a signature (untrusted root is
          # expected; NotSigned or HashMismatch would mean signing failed).
          $sig = Get-AuthenticodeSignature $bundle.FullName
          Write-Host "Installer signature: $($sig.Status)"
          if ($sig.Status -eq 'NotSigned' -or $sig.Status -eq 'HashMismatch') {
            throw "Signing failed: $($sig.Status)"
          }

          # Replace the asset on the release with the signed file
          gh release upload "${{ needs.version.outputs.tag }}" $bundle.FullName --clobber --repo "${{ github.repository }}"
          Write-Host "Signed installer uploaded: $($bundle.Name)"

          # Same treatment for the MSI staged by the build step above, so
          # every Windows artifact carries the same publisher identity.
          $msi = Get-ChildItem "Fress_*_x64_en-US.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found for signing" }
          & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /td SHA256 `
            /tr http://timestamp.digicert.com $msi.FullName
          $msiSig = Get-AuthenticodeSignature $msi.FullName
          Write-Host "MSI signature: $($msiSig.Status)"
          if ($msiSig.Status -eq 'NotSigned' -or $msiSig.Status -eq 'HashMismatch') {
            throw "MSI signing failed: $($msiSig.Status)"
          }

      - name: No signing certificate configured
        # Shipping unsigned is honest: a random self-signed cert per release
        # proves nothing and builds no reputation. The warning keeps the gap
        # visible in the run summary until the secret is configured.
        if: env.FRESS_SIGNING_CONFIGURED != 'true' && env.FRESS_PFX_CONFIGURED != 'true'
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "WARNING: Windows binaries shipped unsigned. Configure WINDOWS_PFX_B64 and WINDOWS_PFX_PASSWORD secrets for a persistent publisher signature (see CODE_SIGNING.md)."

      - name: Upload the MSI
        # Runs in every signing configuration: by the time this step executes
        # the file is either signed (Trusted Signing / PFX above) or the job
        # has already failed its signature check. Without any certificate the
        # MSI still ships, honestly unsigned like the other artifacts.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem "Fress_*_x64_en-US.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found for upload" }
          if ($env:FRESS_SIGNING_CONFIGURED -eq 'true' -or $env:FRESS_PFX_CONFIGURED -eq 'true') {
            $sig = Get-AuthenticodeSignature $msi.FullName
            Write-Host "MSI signature before upload: $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "MSI reached upload without a valid signature: $($sig.Status)" }
          } else {
            Write-Host "No signing configured; uploading the unsigned MSI."
          }
          gh release upload "${{ needs.version.outputs.tag }}" $msi.FullName --clobber --repo "${{ github.repository }}"
          Write-Host "MSI uploaded: $($msi.Name)"

      - name: Package the portable exe
        # A portable build is the bare app exe in a zip: no installer, no
        # registry changes, runs from anywhere with the preinstalled WebView2
        # runtime. Signed the same way as the installer when a certificate is
        # configured, so both artifacts carry the same publisher identity.
        if: env.FRESS_SIGNING_CONFIGURED == 'true' || env.FRESS_PFX_CONFIGURED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "portable exe not found in release folder" }
          Write-Host "Portable exe: $($exe.FullName)"

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.DirectoryName -match 'x64$' } | Select-Object -First 1
          $thumb = (Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Sort-Object NotAfter -Descending | Select-Object -First 1).Thumbprint
          if ($signtool -and $thumb) {
            & $signtool.FullName sign /sha1 $thumb /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe.FullName
          } else {
            Write-Host "No code-signing certificate in store; packaging unsigned portable exe."
          }

          $version = "${{ needs.version.outputs.version }}"
          $zip = "Fress_${version}_x64-portable.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          gh release upload "${{ needs.version.outputs.tag }}" $zip --clobber --repo "${{ github.repository }}"
          Write-Host "Portable build uploaded: $zip"

      - name: Package the portable exe (unsigned fallback)
        if: env.FRESS_SIGNING_CONFIGURED != 'true' && env.FRESS_PFX_CONFIGURED != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "portable exe not found in release folder" }
          $version = "${{ needs.version.outputs.version }}"
          $zip = "Fress_${version}_x64-portable.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          gh release upload "${{ needs.version.outputs.tag }}" $zip --clobber --repo "${{ github.repository }}"
          Write-Host "Portable build uploaded: $zip"

      - name: Generate the updater signature over the final installer
        # Runs LAST so it signs the bytes that actually ship: when
        # Authenticode is configured above, the installer in bundle/nsis is
        # the signed one, and a build-time .sig would no longer match it
        # (Authenticode rewrites the exe). Regenerating here keeps the
        # updater chain valid in every configuration - signed or not. The
        # latest.json manifest itself is assembled afterwards by the
        # updater-manifest job from the .sig files this and the other jobs
        # upload.
        if: env.FRESS_UPDATER_KEY == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $bundle) { throw "installer exe not found for updater signing" }
          npx tauri signer sign "$($bundle.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed with exit code $LASTEXITCODE" }
          $sigPath = "$($bundle.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "updater signature was not produced: $sigPath" }
          Write-Host "Updater signature generated over the final installer: $(Split-Path -Leaf $sigPath)"
          gh release upload "${{ needs.version.outputs.tag }}" $sigPath --clobber --repo "${{ github.repository }}"
          Write-Host "Updater signature uploaded: $(Split-Path -Leaf $sigPath)"

  build-windows-arm64:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    # Native ARM64 builds for newer Windows-on-ARM devices: lighter and faster
    # than running the x64 build through emulation. Produced on every release
    # from now on, both as an installer and as a portable zip.
    needs: [version, create-release]
    runs-on: windows-latest
    env:
      # Same complete-credential gates as the x64 job: all six Trusted
      # Signing secrets, or both .pfx secrets, or the path stays off.
      FRESS_SIGNING_CONFIGURED: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_CODESIGNING_ENDPOINT != '' && secrets.AZURE_CODESIGNING_ACCOUNT != '' && secrets.AZURE_CODESIGNING_PROFILE != '' }}
      FRESS_PFX_CONFIGURED: ${{ secrets.WINDOWS_PFX_B64 != '' && secrets.WINDOWS_PFX_PASSWORD != '' }}
      # true when the Tauri updater signing key is set (updater artifacts).
      FRESS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      FRESS_AZ_1: ${{ secrets.AZURE_TENANT_ID != '' }}
      FRESS_AZ_2: ${{ secrets.AZURE_CLIENT_ID != '' }}
      FRESS_AZ_3: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
      FRESS_AZ_4: ${{ secrets.AZURE_CODESIGNING_ENDPOINT != '' }}
      FRESS_AZ_5: ${{ secrets.AZURE_CODESIGNING_ACCOUNT != '' }}
      FRESS_AZ_6: ${{ secrets.AZURE_CODESIGNING_PROFILE != '' }}
      FRESS_PFX_1: ${{ secrets.WINDOWS_PFX_B64 != '' }}
      FRESS_PFX_2: ${{ secrets.WINDOWS_PFX_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes to git; the release uploads
          # authenticate via GH_TOKEN env vars instead.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Install cross-compile target
        run: rustup target add aarch64-pc-windows-msvc
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Diagnose partial signing configuration
        if: env.FRESS_SIGNING_CONFIGURED != 'true'
        shell: pwsh
        run: |
          $azure = @('FRESS_AZ_1','FRESS_AZ_2','FRESS_AZ_3','FRESS_AZ_4','FRESS_AZ_5','FRESS_AZ_6')
          $azureNames = @('AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_CODESIGNING_ENDPOINT','AZURE_CODESIGNING_ACCOUNT','AZURE_CODESIGNING_PROFILE')
          $missing = @()
          for ($i = 0; $i -lt 6; $i++) {
            if ([Environment]::GetEnvironmentVariable($azure[$i]) -ne 'true') { $missing += $azureNames[$i] }
          }
          if ($missing.Count -gt 0 -and $missing.Count -lt 6) {
            Add-Content $env:GITHUB_STEP_SUMMARY "WARNING: Azure Trusted Signing is partially configured and will NOT run. Missing secrets: $($missing -join ', '). All six are required (see CODE_SIGNING.md)."
          }
          $pfxMissing = @()
          if ($env:FRESS_PFX_1 -ne 'true') { $pfxMissing += 'WINDOWS_PFX_B64' }
          if ($env:FRESS_PFX_2 -ne 'true') { $pfxMissing += 'WINDOWS_PFX_PASSWORD' }
          if ($pfxMissing.Count -eq 1) {
            Add-Content $env:GITHUB_STEP_SUMMARY "WARNING: the persistent-certificate path is half-configured and will NOT run. Missing secret: $($pfxMissing -join ', '). Both WINDOWS_PFX_B64 and WINDOWS_PFX_PASSWORD are required."
          }
      - name: Build Windows ARM64 installer (NSIS)
        # Deliberately WITHOUT the Tauri updater key, same as the x64 job:
        # the .sig is regenerated over the FINAL (Authenticode-signed)
        # installer at the end of this job, and latest.json is assembled by
        # the updater-manifest job afterwards.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: '--target aarch64-pc-windows-msvc --bundles nsis'
      - name: Sign the ARM64 installer with Azure Trusted Signing
        if: env.FRESS_SIGNING_CONFIGURED == 'true'
        uses: azure/trusted-signing-action@b37b55d83a0c5c993cb33d1b376b20b75e13668c # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODESIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\aarch64-pc-windows-msvc\release\bundle\nsis
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign the ARM64 portable exe with Azure Trusted Signing
        if: env.FRESS_SIGNING_CONFIGURED == 'true'
        uses: azure/trusted-signing-action@b37b55d83a0c5c993cb33d1b376b20b75e13668c # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODESIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\aarch64-pc-windows-msvc\release
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign with the persistent publisher certificate
        if: env.FRESS_SIGNING_CONFIGURED != 'true' && env.FRESS_PFX_CONFIGURED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_PFX_B64: ${{ secrets.WINDOWS_PFX_B64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [Convert]::FromBase64String($env:WINDOWS_PFX_B64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "fress-sign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $pwd2 = ConvertTo-SecureString -String $env:WINDOWS_PFX_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $pwd2
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.DirectoryName -match 'x64$' } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $bundle = Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /td SHA256 `
            /tr http://timestamp.digicert.com $bundle.FullName
          $sig = Get-AuthenticodeSignature $bundle.FullName
          if ($sig.Status -eq 'NotSigned' -or $sig.Status -eq 'HashMismatch') {
            throw "Signing failed: $($sig.Status)"
          }
          gh release upload "${{ needs.version.outputs.tag }}" $bundle.FullName --clobber --repo "${{ github.repository }}"
          Write-Host "Signed ARM64 installer uploaded: $($bundle.Name)"

      - name: No signing certificate configured
        if: env.FRESS_SIGNING_CONFIGURED != 'true' && env.FRESS_PFX_CONFIGURED != 'true'
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "WARNING: Windows ARM64 binaries shipped unsigned. Configure WINDOWS_PFX_B64 and WINDOWS_PFX_PASSWORD secrets (see CODE_SIGNING.md)."

      - name: Package the ARM64 portable exe
        if: env.FRESS_SIGNING_CONFIGURED == 'true' || env.FRESS_PFX_CONFIGURED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "ARM64 portable exe not found in release folder" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.DirectoryName -match 'x64$' } | Select-Object -First 1
          $thumb = (Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Sort-Object NotAfter -Descending | Select-Object -First 1).Thumbprint
          if ($signtool -and $thumb) {
            & $signtool.FullName sign /sha1 $thumb /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe.FullName
          }
          $version = "${{ needs.version.outputs.version }}"
          $zip = "Fress_${version}_arm64-portable.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          gh release upload "${{ needs.version.outputs.tag }}" $zip --clobber --repo "${{ github.repository }}"
          Write-Host "ARM64 portable build uploaded: $zip"

      - name: Package the ARM64 portable exe (unsigned fallback)
        if: env.FRESS_SIGNING_CONFIGURED != 'true' && env.FRESS_PFX_CONFIGURED != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "ARM64 portable exe not found in release folder" }
          $version = "${{ needs.version.outputs.version }}"
          $zip = "Fress_${version}_arm64-portable.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          gh release upload "${{ needs.version.outputs.tag }}" $zip --clobber --repo "${{ github.repository }}"
          Write-Host "ARM64 portable build uploaded: $zip"

      - name: Generate the updater signature over the final ARM64 installer
        # Same rule as the x64 job: sign LAST, over the bytes that ship, so
        # the updater signature always matches the uploaded installer.
        if: env.FRESS_UPDATER_KEY == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $bundle) { throw "ARM64 installer exe not found for updater signing" }
          npx tauri signer sign "$($bundle.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed with exit code $LASTEXITCODE" }
          $sigPath = "$($bundle.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "updater signature was not produced: $sigPath" }
          Write-Host "Updater signature generated over the final ARM64 installer: $(Split-Path -Leaf $sigPath)"
          gh release upload "${{ needs.version.outputs.tag }}" $sigPath --clobber --repo "${{ github.repository }}"
          Write-Host "Updater signature uploaded: $(Split-Path -Leaf $sigPath)"

  build-linux:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    needs: [version, create-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes to git; the release uploads
          # authenticate via GH_TOKEN env vars instead.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Decide updater signing flags
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=--config updater-overrides.json" >> "$GITHUB_OUTPUT"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is not set - shipping without updater artifacts (latest.json). See CODE_SIGNING.md."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Linux bundles (AppImage + deb + rpm)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: '--target x86_64-unknown-linux-gnu --bundles appimage deb rpm ${{ steps.updater.outputs.args }}'

  build-macos-arm:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    needs: [version, create-release]
    runs-on: macos-latest
    env:
      # Unset secrets expand to empty strings, and an empty APPLE_CERTIFICATE
      # would still make the bundler attempt signing (it only checks presence).
      # So the build steps below are gated on this flag instead - and the flag
      # requires the COMPLETE credential set: signing needs the P12 plus its
      # password plus the identity name, notarization needs the Apple ID,
      # its app-specific password and the team id. Activating the path with
      # half of these would fail inside tauri-action with a confusing error.
      FRESS_APPLE_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      FRESS_APPLE_1: ${{ secrets.APPLE_CERTIFICATE != '' }}
      FRESS_APPLE_2: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      FRESS_APPLE_3: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      FRESS_APPLE_4: ${{ secrets.APPLE_ID != '' }}
      FRESS_APPLE_5: ${{ secrets.APPLE_PASSWORD != '' }}
      FRESS_APPLE_6: ${{ secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes to git; the release uploads
          # authenticate via GH_TOKEN env vars instead.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin
      # rust-toolchain.toml pins channel 1.98.1, which rustup resolves as a
      # SEPARATE toolchain from the action's "stable" install — targets given
      # to the action land in the wrong one. Install explicitly into the
      # ACTIVE (overridden) toolchain, same as the android fallback step.
      - name: Install cross-compile target
        run: rustup target add aarch64-apple-darwin
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Diagnose partial Apple signing configuration
        # Same rule as the Windows jobs: when the signed/notarized path did
        # not activate, say exactly which of the six credentials are missing
        # instead of quietly shipping an unsigned dmg.
        if: env.FRESS_APPLE_CONFIGURED != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          flags=("$FRESS_APPLE_1" "$FRESS_APPLE_2" "$FRESS_APPLE_3" "$FRESS_APPLE_4" "$FRESS_APPLE_5" "$FRESS_APPLE_6")
          missing=""
          for i in 0 1 2 3 4 5; do
            if [ "${flags[$i]}" != "true" ]; then
              missing="${missing:+$missing, }${names[$i]}"
            fi
          done
          count=$(echo "$missing" | awk -F', ' '{print NF}')
          if [ "$count" -gt 0 ] && [ "$count" -lt 6 ]; then
            echo "WARNING: Apple signing is partially configured and will NOT run. Missing secrets: $missing. All six are required (see CODE_SIGNING.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set - shipping without updater artifacts (latest.json). See CODE_SIGNING.md."
          fi
      - name: Decide updater signing flags
        # The Tauri updater artifacts (.app.tar.gz + .sig) are only built
        # when the update key exists as a secret; without it the release
        # builds exactly as before. macOS has no post-build binary mutation
        # (Apple signing and notarization happen INSIDE the bundler, before
        # the updater signature is computed), so unlike Windows these
        # signatures are safe to generate at build time.
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=--config updater-overrides.json" >> "$GITHUB_OUTPUT"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is not set - shipping without updater artifacts (latest.json). See CODE_SIGNING.md."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build macOS Apple Silicon (.dmg), signed and notarized
        # Runs only when the Apple Developer credentials are configured.
        # tauri-action signs the app, submits it for notarization and staples
        # the ticket, so the dmg opens with no Gatekeeper warning. Setup:
        # CODE_SIGNING.md.
        if: env.FRESS_APPLE_CONFIGURED == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: '--target aarch64-apple-darwin --bundles dmg ${{ steps.updater.outputs.args }}'
      - name: Build macOS Apple Silicon (.dmg), unsigned
        # Without Apple credentials the dmg still builds and ships; macOS asks
        # for a one-time right-click -> Open on first launch.
        if: env.FRESS_APPLE_CONFIGURED != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: '--target aarch64-apple-darwin --bundles dmg ${{ steps.updater.outputs.args }}'

  build-macos-intel:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    needs: [version, create-release]
    runs-on: macos-latest
    env:
      # Same complete-credential gate as the Apple Silicon job: all six
      # secrets, or the build ships unsigned.
      FRESS_APPLE_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      FRESS_APPLE_1: ${{ secrets.APPLE_CERTIFICATE != '' }}
      FRESS_APPLE_2: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      FRESS_APPLE_3: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      FRESS_APPLE_4: ${{ secrets.APPLE_ID != '' }}
      FRESS_APPLE_5: ${{ secrets.APPLE_PASSWORD != '' }}
      FRESS_APPLE_6: ${{ secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes to git; the release uploads
          # authenticate via GH_TOKEN env vars instead.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-apple-darwin
      - name: Install cross-compile target
        run: rustup target add x86_64-apple-darwin
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Diagnose partial Apple signing configuration
        if: env.FRESS_APPLE_CONFIGURED != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          flags=("$FRESS_APPLE_1" "$FRESS_APPLE_2" "$FRESS_APPLE_3" "$FRESS_APPLE_4" "$FRESS_APPLE_5" "$FRESS_APPLE_6")
          missing=""
          for i in 0 1 2 3 4 5; do
            if [ "${flags[$i]}" != "true" ]; then
              missing="${missing:+$missing, }${names[$i]}"
            fi
          done
          count=$(echo "$missing" | awk -F', ' '{print NF}')
          if [ "$count" -gt 0 ] && [ "$count" -lt 6 ]; then
            echo "WARNING: Apple signing is partially configured and will NOT run. Missing secrets: $missing. All six are required (see CODE_SIGNING.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set - shipping without updater artifacts (latest.json). See CODE_SIGNING.md."
          fi
      - name: Decide updater signing flags
        # Same rationale as the Apple Silicon job: signatures are computed
        # inside the bundler, after Apple signing, so they are valid at
        # build time.
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=--config updater-overrides.json" >> "$GITHUB_OUTPUT"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is not set - shipping without updater artifacts (latest.json). See CODE_SIGNING.md."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Cross-compile macOS Intel (.dmg), signed and notarized
        # Cross-compiling from the arm64 runner keeps the Intel build fast;
        # signing and notarization work the same way.
        if: env.FRESS_APPLE_CONFIGURED == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: '--target x86_64-apple-darwin --bundles dmg ${{ steps.updater.outputs.args }}'
      - name: Cross-compile macOS Intel (.dmg), unsigned
        if: env.FRESS_APPLE_CONFIGURED != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: '--target x86_64-apple-darwin --bundles dmg ${{ steps.updater.outputs.args }}'

  build-android:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    needs: [version, create-release]
    runs-on: ubuntu-latest
    env:
      # true when the persistent keystore is stored as a repository secret.
      FRESS_KEYSTORE_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes to git; the release uploads
          # authenticate via GH_TOKEN env vars instead.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - name: Install Rust Android targets (fallback)
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Point ANDROID_NDK_HOME at an installed NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - name: Restore the persistent signing keystore
        # Android refuses to update an installed app when the update is
        # signed with a different key, so a fresh keystore per release
        # silently broke update-over-install for existing users. The
        # keystore is stored once as a repository secret (ANDROID_KEYSTORE_B64,
        # base64 of the .keystore file) and reused for every release.
        # Its password lives in the ANDROID_KEYSTORE_PASSWORD secret and is
        # handed to every keystore command through step-level env vars -
        # never as a literal in this file and never echoed into logs.
        if: env.FRESS_KEYSTORE_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo '::error::ANDROID_KEYSTORE_PASSWORD is not configured. Set the repository Actions secret ANDROID_KEYSTORE_PASSWORD to the store/key password of the permanent fress.keystore. The workflow fails closed rather than guessing a password.'
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_B64}" | base64 -d > fress.keystore
          keytool -list -keystore fress.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias fress >/dev/null 2>&1 \
            || { echo '::error::ANDROID_KEYSTORE_B64 cannot be opened as fress.keystore (alias fress) with the ANDROID_KEYSTORE_PASSWORD secret. Either the password secret is wrong for this keystore or the keystore secret is wrong. Rotate the keystore password locally with keytool -storepasswd/-keypasswd while KEEPING the signing key, or fix the secret; do not mint a new keystore.'; exit 1; }
          # Identity check: only THE permanent key may sign a release. The
          # check above proves the secret's SHAPE (a keystore with that alias
          # and password); this proves its IDENTITY, so a freshly generated
          # keystore with the same alias and password can never sign a Fress
          # release - that would silently break in-place updates for every
          # installed device from the 1.0.6-beta signing baseline on.
          # Certificate fingerprints are public by design (they ship inside
          # every signed APK); pinning one here costs no secrecy.
          EXPECTED_FP="b0fd578d669171af2830dcc91707d92267eea44f2a79651e2614d975e4cbdf27"
          ACTUAL_FP=$(keytool -list -v -keystore fress.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias fress 2>/dev/null \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-Z' 'a-z')
          if [ -z "$ACTUAL_FP" ]; then
            echo '::error::could not read the certificate fingerprint from fress.keystore with the ANDROID_KEYSTORE_PASSWORD secret; refusing to sign.'
            exit 1
          fi
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "::error::keystore certificate fingerprint mismatch: expected the permanent Fress key ($EXPECTED_FP), got ($ACTUAL_FP). ANDROID_KEYSTORE_B64 holds the wrong keystore; restore the backup before releasing."
            exit 1
          fi
      - name: Require the persistent signing keystore
        # v1.0.6-alpha was signed with a CI-generated throwaway keystore, so
        # its installs can never take a signature-locked update from a
        # different key. Minting ANOTHER throwaway per release would lock
        # every future install out the same way, so from here on a release
        # without the persistent keystore FAILS LOUDLY instead of silently
        # generating a temporary identity.
        #
        # One-time setup (local machine) - choose a STRONG password, never a
        # short literal, and keep it out of this repository:
        #   keytool -genkeypair -v -keystore fress.keystore -alias fress \
        #     -keyalg RSA -keysize 2048 -validity 10000 \
        #     -storepass '<strong-password>' -keypass '<strong-password>' \
        #     -dname "CN=Fress, OU=Fress, O=Fress, L=Internet, ST=Internet, C=US"
        #   base64 -w0 fress.keystore              # ANDROID_KEYSTORE_B64 secret
        #   <strong-password>                      # ANDROID_KEYSTORE_PASSWORD secret
        if: env.FRESS_KEYSTORE_CONFIGURED != 'true'
        run: |
          echo '::error::ANDROID_KEYSTORE_B64 is not configured, so the Android build cannot proceed. Releases must never be signed with a freshly generated keystore: a changed signing key breaks in-place updates for every installed device. Generate the keystore ONCE locally (alias fress), store it base64-encoded as the ANDROID_KEYSTORE_B64 secret and its password as the ANDROID_KEYSTORE_PASSWORD secret - see the comments above - then re-run this job.'
          exit 1
      - name: Build Android APKs (per-ABI splits + universal)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/fress.keystore
          TAURI_ANDROID_KEY_ALIAS: fress
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo '::error::ANDROID_KEYSTORE_PASSWORD is not configured; refusing to build the signed APKs.'
            exit 1
          fi
          # The gradle build signs through Tauri's keystore env vars. The
          # secret stays an environment variable end to end - it is never
          # baked into this script text or printed.
          export TAURI_ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export TAURI_ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          npx tauri android init
          # Stamp our own launcher icon (blue leaf) into the generated Android
          # project. Without this the APK ships the Tauri template icon.
          npx tauri icon src-tauri/icons/icon.png
          # Two gradle passes: gradle's per-ABI split output and its universal
          # APK are mutually exclusive (enabling the abi splits turns
          # universalApk off), so pass one builds one small APK per ABI and
          # pass two builds the universal one. The Rust cross builds are
          # cached between the passes - the second run is mostly packaging.
          npx tauri android build --apk --split-per-abi --target aarch64 --target armv7 --target i686 --target x86_64
          npx tauri android build --apk --target aarch64 --target armv7 --target i686 --target x86_64
      - name: Align, sign, and upload APKs
        # The old arm64 lookup (-path '*arm64*') never matched the actual
        # gradle output layout, so every release silently shipped only the
        # universal APK. Now every unsigned APK is classified by its output
        # directory and mapped to its release asset name; universal is
        # mandatory, per-ABI files upload when present.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo '::error::ANDROID_KEYSTORE_PASSWORD is not configured; refusing to sign the APKs.'
            exit 1
          fi
          VERSION="${{ needs.version.outputs.version }}"
          OUT="src-tauri/gen/android/app/build/outputs/apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          classify() {
            # Gradle output layout: apk/<abi>/release/<file>.apk - the ABI
            # directory is TWO levels above the file. Fall back to the file
            # name itself (app-universal-release-unsigned.apk and friends).
            local dir=$(basename "$(dirname "$(dirname "$1")")")
            local file=$(basename "$1")
            case "$dir" in
              universal) echo "universal"; return ;;
              arm64|arm64-v8a) echo "arm64"; return ;;
              # tauri's gradle names the armv7 split dir "arm" (not
              # armeabi-v7a): apk/arm/release/app-arm-release-unsigned.apk
              arm|armeabi-v7a|armeabi) echo "arm"; return ;;
              x86_64) echo "x64"; return ;;
              x86) echo "x86"; return ;;
            esac
            case "$file" in
              *universal*) echo "universal" ;;
              *arm64*|*v8a*) echo "arm64" ;;
              *armeabi*|*v7a*) echo "arm" ;;
              *arm*) echo "arm" ;;
              *x86_64*) echo "x64" ;;
              *x86*) echo "x86" ;;
              *) echo "" ;;
            esac
          }
          declare -A SIGNED=()
          for apk in $(find "$OUT" -name '*unsigned.apk' -not -path '*aligned*'); do
            kind=$(classify "$apk")
            echo "found APK: $apk -> ${kind:-unclassified}"
            if [ -z "$kind" ]; then continue; fi
            if [ -n "${SIGNED[$kind]:-}" ]; then continue; fi
            "$BT/zipalign" -f -p 4 "$apk" aligned.apk
            "$BT/apksigner" sign --ks fress.keystore --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias fress --key-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --out "Fress_${VERSION}_${kind}.apk" aligned.apk
            "$BT/apksigner" verify "Fress_${VERSION}_${kind}.apk"
            SIGNED[$kind]="Fress_${VERSION}_${kind}.apk"
          done
          if [ -z "${SIGNED[universal]:-}" ]; then echo "No universal APK found"; exit 1; fi
          if [ -z "${SIGNED[arm64]:-}" ]; then echo "::error::--split-per-abi produced no arm64 APK; the per-ABI promise needs it"; exit 1; fi
          UPLOADS="${SIGNED[universal]}"
          for kind in arm64 arm x64 x86; do
            if [ -n "${SIGNED[$kind]:-}" ]; then UPLOADS="$UPLOADS ${SIGNED[$kind]}"; fi
          done
          ls -la Fress_*.apk
          gh release upload "${{ needs.version.outputs.tag }}" $UPLOADS --clobber

  updater-manifest:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    # Assembles latest.json from the .sig files that are on the release AFTER
    # every binary reached its final form. Two reasons this must not happen
    # at build time:
    #   1. Authenticode (Windows) signs the installer AFTER tauri-action's
    #      build, rewriting the exe bytes; any updater signature generated at
    #      build time would no longer match the shipped installer. The
    #      Windows jobs therefore regenerate their .sig over the FINAL
    #      binaries (last step of each job) and this job reads those.
    #   2. tauri-action's own manifest points every platform at
    #      releases/latest/download/<asset> - an alias that only resolves
    #      for STABLE releases and 404s while Fress publishes prereleases.
    #      The manifest assembled here uses the versioned download URLs,
    #      which always resolve.
    # Runs before the checksum pass so latest.json itself gets a SHA256SUMS
    # entry like every other asset.
    needs: [version, create-release, build-windows, build-windows-arm64, build-linux, build-macos-arm, build-macos-intel]
    runs-on: ubuntu-latest
    env:
      FRESS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Assemble latest.json from the final updater signatures
        if: env.FRESS_UPDATER_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          # Only the small signature files are downloaded; artifact presence
          # itself is verified through the release's asset list.
          gh release download "$TAG" --dir sigs --pattern '*.sig' --clobber --repo "${{ github.repository }}"
          # Draft-proof release lookup: the raw by-tag endpoint
          # (/releases/tags/<tag>) does not resolve draft releases, and every
          # Fress release is a draft until verify-release publishes it. List
          # releases and match the tag instead - that works for drafts and
          # published releases alike. (The gh CLI commands above resolve
          # drafts by tag_name field; this raw call must not use the
          # by-tag endpoint.)
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[].name" > assets.txt
          # Deterministic pub_date source: the release's created_at. The
          # manifest must be BYTE-STABLE across job re-runs - a wall-clock
          # pub_date makes every rerun produce different latest.json bytes,
          # which silently invalidates the SHA256SUMS.txt entry whenever
          # this job is re-run alone after the checksum pass. That is
          # exactly how the historical latest.json <-> SHA256SUMS.txt drift
          # happened; the timestamp now comes from the release object.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .created_at" > release-created-at.txt
          if [ ! -s release-created-at.txt ]; then
            echo "::error::could not read release created_at for $TAG"
            exit 1
          fi
          export RELEASE_CREATED_AT=$(cat release-created-at.txt)
          if [ ! -s assets.txt ]; then
            echo "::error::release $TAG not found or has no assets yet"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          names = set(open("assets.txt").read().split())
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def entry(asset: str) -> dict:
              sig_path = os.path.join("sigs", asset + ".sig")
              if not os.path.exists(sig_path):
                  sys.exit(f"::error::{asset}.sig is on the release but was not downloaded; cannot embed its signature")
              sig = open(sig_path).read().strip()
              return {"signature": sig, "url": f"{base}/{asset}"}

          # (platform key, bundle-suffixed key or None, asset name)
          plans = [
              ("windows-x86_64",  "windows-x86_64-nsis",  f"Fress_{version}_x64-setup.exe"),
              ("windows-aarch64", "windows-aarch64-nsis", f"Fress_{version}_arm64-setup.exe"),
              ("linux-x86_64",    "linux-x86_64-appimage", f"Fress_{version}_amd64.AppImage"),
              (None,              "linux-x86_64-deb",     f"Fress_{version}_amd64.deb"),
          ]
          # The RPM follows the native RPM naming (Fress-<version>-<bld>.x86_64.rpm).
          rpms = sorted(n for n in names if n.startswith(f"Fress-{version}-") and n.endswith(".x86_64.rpm"))
          if rpms:
              plans.append((None, "linux-x86_64-rpm", rpms[0]))
          # darwin updater artifacts, when the bundler produced them
          for n in sorted(names):
              if n.endswith(".app.tar.gz") and n + ".sig" in names:
                  if "aarch64" in n:
                      plans.append(("darwin-aarch64", None, n))
                  elif "x86_64" in n or "x64" in n:
                      plans.append(("darwin-x86_64", None, n))

          platforms = {}
          skipped = []
          for plain, suffixed, asset in plans:
              if asset not in names or asset + ".sig" not in names:
                  skipped.append(asset)
                  continue
              e = entry(asset)
              if plain:
                  platforms[plain] = e
              if suffixed:
                  platforms[suffixed] = e

          missing = [k for k in ("windows-x86_64", "windows-aarch64", "linux-x86_64") if k not in platforms]
          if missing:
              sys.exit(f"::error::latest.json would be missing required platforms {missing}; "
                       f"their .sig files are not on the release. Skipped assets: {skipped or 'none'}")

          manifest = {
              "version": version,
              # Deterministic: derived from the release object, NOT the
              # wall clock. Re-running this job reproduces byte-identical
              # latest.json, so a rerun can never invalidate the
              # SHA256SUMS.txt entry the checksums job already published.
              "pub_date": os.environ["RELEASE_CREATED_AT"].strip(),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print("latest.json platforms:", ", ".join(sorted(platforms)))
          if skipped:
              print("optional updater entries skipped (artifact or .sig absent):", ", ".join(skipped))
          PY
          python3 -c "import json; json.load(open('latest.json'))" # hard-validate the JSON
          gh release upload "$TAG" latest.json --clobber --repo "${{ github.repository }}"
          echo "latest.json uploaded: $(python3 -c "import json;print(len(json.load(open('latest.json'))['platforms']))") platform entries"

  checksums:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    needs: [version, create-release, build-windows, build-windows-arm64, build-linux, build-macos-arm, build-macos-intel, build-android, updater-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes to git; the release uploads
          # authenticate via GH_TOKEN env vars instead.
          persist-credentials: false
      - name: Download all release assets
        run: |
          mkdir -p assets
          gh release download "${{ needs.version.outputs.tag }}" --dir assets --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SHA256SUMS.txt
        run: |
          cd assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | xargs -0 sha256sum | sed 's|  \./|  |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload checksums to the release
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" assets/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  virustotal:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    # Scans every release asset with VirusTotal and appends the analysis
    # links to the release page, so users can see multi-engine results before
    # they trust a download. Uses the public VT API directly (4 uploads/min
    # is enough for one release); runs when a VIRUSTOTAL_API_KEY secret is
    # set (free account at virustotal.com).
    #
    # INFORMATIONAL by design: this is a convenience overlay on the release
    # page, never a publication gate - the artifact audit is the gate. The
    # skip is labeled, not silent: without the key the job prints why and
    # exits green, so a green run can never be mistaken for "scanned and
    # clean".
    needs: [version, checksums]
    runs-on: ubuntu-latest
    env:
      FRESS_VT_CONFIGURED: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}
    steps:
      - name: Say so when the scan is skipped (informational, not a pass)
        if: env.FRESS_VT_CONFIGURED != 'true'
        run: echo "::notice::VirusTotal scan skipped - VIRUSTOTAL_API_KEY is not configured. Informational only; the SHA256SUMS.txt + signature audit remains the integrity gate."
      - name: Scan assets and attach analysis links
        if: env.FRESS_VT_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber --repo "${{ github.repository }}"
          LINKS=""
          for f in assets/*; do
            name=$(basename "$f")
            [ "$name" = "SHA256SUMS.txt" ] && continue
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            url="https://www.virustotal.com/gui/file/$sha/detection"
            code=$(curl -sS -o /tmp/vt.json -w "%{http_code}" \
              -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/files/$sha")
            if [ "$code" != "200" ]; then
              # not in VT's corpus yet: upload (public API allows 4/min)
              curl -sS -o /tmp/vt-up.json --max-time 300 \
                -H "x-apikey: $VT_API_KEY" \
                -F "file=@$f" "https://www.virustotal.com/api/v3/files" > /dev/null
              sleep 16
              echo "submitted $name (analysis running)"
            fi
            LINKS="${LINKS}- [\`$name\`]($url)"$'\n'
          done
          # Append the scan links section to the release body
          gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body > body.md
          if ! grep -q "VirusTotal scan" body.md; then
            {
              echo ""
              echo "**VirusTotal scan of every asset**"
              echo ""
              sed 's/^//' <<< "$LINKS"
              echo "ML-based engines flag clean, low-reputation binaries; the verdicts that matter are signature-based ones. Verify first against \`SHA256SUMS.txt\`."
            } >> body.md
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file body.md
            echo "release body updated with VirusTotal links"
          fi

  verify-release:
    permissions:
      contents: write # the only job privilege this workflow needs beyond read
    # The gate between "CI built something" and "users can download it".
    # Runs after every build and the checksum pass, checks that every
    # required artifact is present, that every uploaded file still hashes
    # to its SHA256SUMS.txt entry, and that latest.json + every signature
    # sidecar are consistent with the exact final bytes (final artifact
    # audit), and only then publishes the draft. A missing AppImage, a
    # truncated upload, a stale latest.json or an invalid sidecar now
    # leaves the release as a private draft: re-run the failed jobs, the
    # draft fills back up.
    #
    # needs: [version, checksums] -- virustotal deliberately NOT in needs:
    # it is documented as an informational overlay on the release page and
    # must never be able to block publication. With it in needs, one
    # transient VT API error would leave a fully verified release stuck as
    # a draft forever - a convenience feature holding the gate hostage. It
    # runs in parallel off the same checksums result instead; the integrity
    # boundary is version -> checksums -> verify-release -> draft=false.
    needs: [version, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The audit script and tauri.conf.json come from the tagged
          # commit; nothing here pushes to git and the checkout token is
          # not persisted, so the untrusted release bytes can never reach it.
          persist-credentials: false
      - name: Verify asset completeness and checksums, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber --repo "${{ github.repository }}"

          cd assets
          echo "Assets on the release:"
          ls -la

          REQUIRED=(
            "Fress_${VERSION}_x64-setup.exe"
            "Fress_${VERSION}_x64_en-US.msi"
            "Fress_${VERSION}_x64-portable.zip"
            "Fress_${VERSION}_arm64-setup.exe"
            "Fress_${VERSION}_arm64-portable.zip"
            "Fress_${VERSION}_x64.dmg"
            "Fress_${VERSION}_aarch64.dmg"
            "Fress_${VERSION}_amd64.AppImage"
            "Fress_${VERSION}_amd64.deb"
            "Fress_${VERSION}_universal.apk"
            "Fress_${VERSION}_arm64.apk"
            # The updater manifest and every signature sidecar of the
            # in-app-update matrix are release-blocking too: a release
            # without them must not promise verified in-app updates, and
            # latest.json must never be published against a subset.
            "latest.json"
            "Fress_${VERSION}_x64-setup.exe.sig"
            "Fress_${VERSION}_arm64-setup.exe.sig"
            "Fress_${VERSION}_amd64.AppImage.sig"
            "Fress_${VERSION}_amd64.deb.sig"
            "SHA256SUMS.txt"
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::required artifact missing or empty: $f"
              MISSING=1
            fi
          done
          # The RPM follows the native RPM naming convention with dashes and
          # a build number (Fress-1.0.2-alpha-1.x86_64.rpm), not the
          # underscore scheme the other bundles use, so it is matched by glob.
          RPM=$(ls Fress*x86_64.rpm 2>/dev/null | head -1)
          if [ -z "$RPM" ] || [ ! -s "$RPM" ]; then
            echo "::error::required artifact missing or empty: Fress*x86_64.rpm"
            MISSING=1
          fi
          RPM_SIG="${RPM}.sig"
          if [ -z "$RPM" ] || [ ! -s "$RPM_SIG" ]; then
            echo "::error::required sidecar missing or empty: Fress*x86_64.rpm.sig (the rpm is in the in-app-update matrix)"
            MISSING=1
          fi
          # The per-ABI APKs are produced by the --split-per-abi gradle pass
          # and enforced as required above (arm64) or best-effort (armv7,
          # x86_64, x86) - the universal APK remains the fallback for
          # architectures we could not split for.
          if [ "$MISSING" != "0" ]; then
            echo "::error::release is incomplete; it stays a private draft. Re-run the failed build jobs, this gate runs again afterwards."
            exit 1
          fi

          # Smoke test: every shipped file must still hash to its
          # SHA256SUMS.txt entry, so a corrupted/truncated upload can never
          # publish alongside a checksum that no longer matches it.
          STATUS=0
          while read -r expected name; do
            if [ "$name" = "SHA256SUMS.txt" ]; then continue; fi
            if [ ! -f "$name" ]; then
              echo "::error::SHA256SUMS.txt lists $name which is not on the release"; STATUS=1; continue
            fi
            actual=$(sha256sum "$name" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$name hashes to $actual but SHA256SUMS.txt says $expected"; STATUS=1
            fi
          done < <(sed 's/  \+/ /g' SHA256SUMS.txt)
          for f in *; do
            if [ "$f" = "SHA256SUMS.txt" ]; then continue; fi
            grep -q " $f\$" SHA256SUMS.txt || { echo "::error::$f has no SHA256SUMS.txt entry"; STATUS=1; }
          done
          [ "$STATUS" = "0" ] || { echo "::error::checksum verification failed; release stays a draft"; exit 1; }

          # FINAL ARTIFACT AUDIT - the deep consistency gate over the exact
          # bytes about to be published. Beyond the checksum re-hash above
          # it verifies:
          #   - latest.json: version field, every platform URL against this
          #     tag, every embedded signature against the <asset>.sig sidecar
          #     bytes on the release, required platform matrix (windows x64
          #     + arm64, linux), no references to nonexistent assets,
          #   - every sidecar cryptographically verified over the artifact's
          #     exact bytes against the production minisign key
          #     (scripts/ci/verify-release-artifacts.py; the embedded
          #     verifier self-checks against RFC 8032 vectors and the app's
          #     own tauri signer fixture before touching release data),
          #   - unsigned classes (dmg/msi/apk/portable) carry no sidecars -
          #     the honest matrix: they are NOT advertised as in-app
          #     verifiable, only the official-page fallback.
          # Anything that mutated an asset after the manifests were
          # generated fails here, and the release stays a private draft.
          python3 "$GITHUB_WORKSPACE/scripts/ci/verify-release-artifacts.py" . "$TAG" "$VERSION" "${{ github.repository }}"

          echo "All required artifacts present, all hashes match, final audit passed. Publishing."
          gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
