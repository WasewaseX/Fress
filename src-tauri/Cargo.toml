[package]
name = "fress"
version = "1.0.2-alpha"
description = "Fress: a clean, curated directory of free and open-source software"
authors = ["Fress"]
edition = "2021"

[lib]
name = "fress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
futures-util = "0.3"
sha2 = "0.10"
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# Kept unstripped on purpose. Stripped Windows binaries trip Microsoft's
# machine-learning heuristics far more often (Trojan:Win32/Bearfoos.A!ml
# false positives on signed, clean apps). The few extra MB of symbol table
# buy fewer antivirus scares for users.
strip = false
