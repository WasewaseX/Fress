[package]
name = "fress"
version = "1.0.12-beta"
description = "Fress: a clean, curated directory of free and open-source software"
authors = ["Fress"]
edition = "2021"

[lib]
name = "fress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# In-repo plugin: the native half of the open boundary (Android FileProvider
# intents for completed downloads). Exposes no webview-facing commands.
tauri-plugin-fress-open = { path = "plugins/fress-open" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
futures-util = "0.3"
sha2 = "0.10"
dirs = "5"
# Self-update artifact authenticity: zero-dependency minisign verification
# of the release .sig sidecars against the compile-time-embedded public key
# (the same crate family the Tauri updater plugin uses).
minisign-verify = "0.3.0"
# Outer-layer base64 for Tauri-format key/signature documents (both are
# single-line base64 of a minisign document).
base64 = "0.22"

[dev-dependencies]
# Feature declarations only: tokio is already a normal dependency, so this
# adds no package to Cargo.lock. Pinning the test module's required feature
# surface explicitly (net/fs/rt) keeps the integration tests compiling even
# if a future dependency change stops enabling those features transitively.
# `test-util` powers the paused-clock stall-timeout test (tokio::time::advance).
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "test-util", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# Kept unstripped on purpose. Stripped Windows binaries trip Microsoft's
# machine-learning heuristics far more often (Trojan:Win32/Bearfoos.A!ml
# false positives on signed, clean apps). The few extra MB of symbol table
# buy fewer antivirus scares for users.
strip = false
